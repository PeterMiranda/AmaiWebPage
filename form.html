<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Encuesta de Diagnóstico Facial</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 480px;
      margin: 40px auto;
      padding: 0;
    }
    .card {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 32px 28px 24px 28px;
      margin-bottom: 24px;
      animation: fadeIn 0.5s;
    }
    .slide {
      display: none;
    }
    .active {
      display: block;
    }
    .card-title {
      font-size: 1.5em;
      font-weight: bold;
      color: #2d3a4a;
      margin-bottom: 18px;
      text-align: center;
      letter-spacing: 0.5px;
    }
    label {
      display: block;
      margin: 16px 0 6px;
      color: #222;
      font-weight: 500;
    }
    .options label {
      display: inline-block;
      margin-right: 18px;
      font-weight: 400;
      margin-bottom: 8px;
    }
    input[type="text"], input[type="number"], select, textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 1em;
      background: #f9fafb;
    }
    textarea {
      resize: vertical;
    }
    .btn {
      background: #4CAF50;
      color: #fff;
      border: none;
      padding: 14px 0;
      border-radius: 8px;
      font-size: 1.1em;
      cursor: pointer;
      width: 100%;
      margin-top: 18px;
      margin-bottom: 0;
      font-weight: bold;
      letter-spacing: 0.5px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #388e3c;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 18px;
    }
    .btn-group .btn {
      flex: 1;
      margin: 0;
    }
    .result {
      margin-top: 10px;
      padding: 18px;
      background: #e8f5e9;
      border-left: 5px solid #4CAF50;
      border-radius: 8px;
      font-size: 1.1em;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .center {
      text-align: center;
    }
    .logo {
      display: block;
      margin: 0 auto 18px auto;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #e0f2f1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2em;
      color: #4CAF50;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Slide 0: Bienvenida -->
    <div class="slide active" id="slide0">
      <div class="card">
        <div class="logo">🧴</div>
        <div class="card-title">Diagnóstico Facial</div>
        <p class="center">Bienvenido/a a la encuesta de diagnóstico facial.<br>
        Responde unas breves preguntas y obtén recomendaciones personalizadas para el cuidado de tu piel.</p>
        <button class="btn" onclick="nextSlide()">Iniciar encuesta</button>
      </div>
    </div>
    <!-- Slide 1: Datos personales -->
    <div class="slide" id="slide1">
      <div class="card">
        <div class="card-title">Datos personales</div>
        <label>Nombre:</label>
        <input type="text" id="nombre" required>
        <label>Edad:</label>
        <input type="number" id="edad" min="10" max="100" required>
        <label>Género:</label>
        <div class="options">
          <label><input type="radio" name="genero" value="Femenino" required> Femenino</label>
          <label><input type="radio" name="genero" value="Masculino"> Masculino</label>
          <label><input type="radio" name="genero" value="Otro"> Otro</label>
        </div>
        <div class="btn-group">
          <button class="btn" onclick="prevSlide()">Anterior</button>
          <button class="btn" onclick="nextSlide()">Siguiente</button>
        </div>
      </div>
    </div>
    <!-- Slide 2: Síntomas principales -->
    <div class="slide" id="slide2">
      <div class="card">
        <div class="card-title">Síntomas principales</div>
        <label>¿Con qué frecuencia tienes granos o espinillas?</label>
        <div class="options">
          <label><input type="radio" name="granos" value="Nunca" required> Nunca</label>
          <label><input type="radio" name="granos" value="A veces"> A veces</label>
          <label><input type="radio" name="granos" value="Frecuentemente"> Frecuentemente</label>
        </div>
        <label>¿Tienes enrojecimiento frecuente en el rostro?</label>
        <div class="options">
          <label><input type="radio" name="enrojecimiento" value="No" required> No</label>
          <label><input type="radio" name="enrojecimiento" value="Leve"> Leve</label>
          <label><input type="radio" name="enrojecimiento" value="Sí, frecuente"> Sí, frecuente</label>
        </div>
        <label>¿Notas manchas oscuras o zonas hiperpigmentadas?</label>
        <div class="options">
          <label><input type="radio" name="manchas" value="No" required> No</label>
          <label><input type="radio" name="manchas" value="Pocas"> Pocas</label>
          <label><input type="radio" name="manchas" value="Varias"> Varias</label>
        </div>
        <div class="btn-group">
          <button class="btn" onclick="prevSlide()">Anterior</button>
          <button class="btn" onclick="nextSlide()">Siguiente</button>
        </div>
      </div>
    </div>
    <!-- Slide 3: Arrugas, resequedad, grasa -->
    <div class="slide" id="slide3">
      <div class="card">
        <div class="card-title">Condición de la piel</div>
        <label>¿Tienes líneas finas o arrugas visibles?</label>
        <div class="options">
          <label><input type="radio" name="arrugas" value="No" required> No</label>
          <label><input type="radio" name="arrugas" value="Algunas"> Algunas</label>
          <label><input type="radio" name="arrugas" value="Bastantes"> Bastantes</label>
        </div>
        <label>¿Sientes la piel tirante o con descamación?</label>
        <div class="options">
          <label><input type="radio" name="resequedad" value="No" required> No</label>
          <label><input type="radio" name="resequedad" value="A veces"> A veces</label>
          <label><input type="radio" name="resequedad" value="Frecuente"> Frecuente</label>
        </div>
        <label>¿Tu piel luce brillante o grasosa durante el día?</label>
        <div class="options">
          <label><input type="radio" name="grasa" value="No" required> No</label>
          <label><input type="radio" name="grasa" value="A veces"> A veces</label>
          <label><input type="radio" name="grasa" value="Frecuente"> Frecuente</label>
        </div>
        <div class="btn-group">
          <button class="btn" onclick="prevSlide()">Anterior</button>
          <button class="btn" onclick="nextSlide()">Siguiente</button>
        </div>
      </div>
    </div>
    <!-- Slide 4: Poros, sensibilidad, solar -->
    <div class="slide" id="slide4">
      <div class="card">
        <div class="card-title">Hábitos y sensibilidad</div>
        <label>¿Ves poros grandes o dilatados en tu rostro?</label>
        <div class="options">
          <label><input type="radio" name="poros" value="No" required> No</label>
          <label><input type="radio" name="poros" value="Algunos"> Algunos</label>
          <label><input type="radio" name="poros" value="Muchos"> Muchos</label>
        </div>
        <label>¿Sientes ardor, picazón o sensibilidad frecuente?</label>
        <div class="options">
          <label><input type="radio" name="sensibilidad" value="No" required> No</label>
          <label><input type="radio" name="sensibilidad" value="A veces"> A veces</label>
          <label><input type="radio" name="sensibilidad" value="Frecuente"> Frecuente</label>
        </div>
        <label>¿Con qué frecuencia usas protector solar?</label>
        <div class="options">
          <label><input type="radio" name="solar" value="Nunca" required> Nunca</label>
          <label><input type="radio" name="solar" value="A veces"> A veces</label>
          <label><input type="radio" name="solar" value="Diario"> Diario</label>
        </div>
        <div class="btn-group">
          <button class="btn" onclick="prevSlide()">Anterior</button>
          <button class="btn" onclick="nextSlide()">Siguiente</button>
        </div>
      </div>
    </div>
    <!-- Slide 5: Hábitos y productos -->
    <div class="slide" id="slide5">
      <div class="card">
        <div class="card-title">Hábitos y productos</div>
        <label>¿Fumas o consumes alcohol frecuentemente?</label>
        <div class="options">
          <label><input type="radio" name="habitos" value="No" required> No</label>
          <label><input type="radio" name="habitos" value="A veces"> A veces</label>
          <label><input type="radio" name="habitos" value="Frecuente"> Frecuente</label>
        </div>
        <label>¿Cuánta agua tomas al día?</label>
        <div class="options">
          <label><input type="radio" name="agua" value="Menos de 1L" required> Menos de 1L</label>
          <label><input type="radio" name="agua" value="1-2L"> 1-2L</label>
          <label><input type="radio" name="agua" value="Más de 2L"> Más de 2L</label>
        </div>
        <label>¿Qué productos usas para limpiar tu rostro?</label>
        <div class="options">
          <label><input type="checkbox" name="productos" value="Jabón común"> Jabón común</label>
          <label><input type="checkbox" name="productos" value="Limpiador facial"> Limpiador facial</label>
          <label><input type="checkbox" name="productos" value="Solo agua"> Solo agua</label>
          <label><input type="checkbox" name="productos" value="Toallitas húmedas"> Toallitas húmedas</label>
        </div>
        <label>Comentarios adicionales:</label>
        <textarea id="comentarios" rows="2"></textarea>
        <div class="btn-group">
          <button class="btn" onclick="prevSlide()">Anterior</button>
          <button class="btn" onclick="submitForm()">Finalizar y ver diagnóstico</button>
        </div>
      </div>
    </div>
    <!-- Slide 6: Resultado -->
    <div class="slide" id="slide6">
      <div class="card">
        <div class="card-title">Resultado</div>
        <div id="resultado" class="result"></div>
        <button class="btn" onclick="restartForm()">Realizar otra encuesta</button>
      </div>
    </div>
  </div>
  <script>
    let currentSlide = 0;
    const totalSlides = 6;

    function showSlide(n) {
      for (let i = 0; i <= totalSlides; i++) {
        document.getElementById('slide' + i).classList.remove('active');
      }
      document.getElementById('slide' + n).classList.add('active');
      currentSlide = n;
    }

    function nextSlide() {
      if (currentSlide < totalSlides) {
        showSlide(currentSlide + 1);
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        showSlide(currentSlide - 1);
      }
    }

    function restartForm() {
      document.querySelectorAll('input[type=radio], input[type=checkbox]').forEach(el => el.checked = false);
      document.getElementById('nombre').value = '';
      document.getElementById('edad').value = '';
      document.getElementById('comentarios').value = '';
      showSlide(0);
    }

    function submitForm() {
      // Recoger respuestas
      const granos = document.querySelector('input[name="granos"]:checked')?.value || "";
      const enrojecimiento = document.querySelector('input[name="enrojecimiento"]:checked')?.value || "";
      const manchas = document.querySelector('input[name="manchas"]:checked')?.value || "";
      const arrugas = document.querySelector('input[name="arrugas"]:checked')?.value || "";
      const resequedad = document.querySelector('input[name="resequedad"]:checked')?.value || "";
      const grasa = document.querySelector('input[name="grasa"]:checked')?.value || "";
      const poros = document.querySelector('input[name="poros"]:checked')?.value || "";
      const sensibilidad = document.querySelector('input[name="sensibilidad"]:checked')?.value || "";
      const solar = document.querySelector('input[name="solar"]:checked')?.value || "";
      const habitos = document.querySelector('input[name="habitos"]:checked')?.value || "";
      const agua = document.querySelector('input[name="agua"]:checked')?.value || "";
      // Diagnóstico simple
      let diagnostico = [];
      let recomendaciones = [];
      // Acné
      if (granos === "Frecuentemente" || (grasa === "Frecuente" && poros !== "No")) {
        diagnostico.push("Acné");
        recomendaciones.push("Lava tu rostro dos veces al día con un limpiador suave. Evita productos comedogénicos y usa hidratante ligero. Considera consultar a un dermatólogo si el acné es severo.");
      }
      // Rosácea
      if (enrojecimiento === "Sí, frecuente" || sensibilidad === "Frecuente") {
        diagnostico.push("Rosácea");
        recomendaciones.push("Evita productos irritantes y cambios bruscos de temperatura. Usa protector solar diario y consulta a un dermatólogo para tratamiento específico.");
      }
      // Manchas oscuras
      if (manchas === "Varias" || solar === "Nunca") {
        diagnostico.push("Manchas oscuras");
        recomendaciones.push("Usa protector solar todos los días. Considera productos con vitamina C o niacinamida. Consulta a un dermatólogo para opciones despigmentantes.");
      }
      // Arrugas
      if (arrugas === "Bastantes" || habitos === "Frecuente") {
        diagnostico.push("Arrugas");
        recomendaciones.push("Hidrata tu piel diariamente, usa protector solar y considera productos con retinol. Evita fumar y el consumo excesivo de alcohol.");
      }
      // Resequedad
      if (resequedad === "Frecuente" || agua === "Menos de 1L") {
        diagnostico.push("Resequedad");
        recomendaciones.push("Usa cremas hidratantes ricas en ceramidas o ácido hialurónico. Evita jabones agresivos y aumenta tu consumo de agua.");
      }
      // Piel grasa
      if (grasa === "Frecuente" && resequedad !== "Frecuente") {
        diagnostico.push("Piel grasa");
        recomendaciones.push("Utiliza productos oil-free y no comedogénicos. Lava tu rostro con limpiadores específicos para piel grasa.");
      }
      // Poros dilatados
      if (poros === "Muchos" && grasa !== "No") {
        diagnostico.push("Poros dilatados");
        recomendaciones.push("Usa exfoliantes suaves y productos con ácido salicílico. Mantén una rutina de limpieza constante.");
      }
      // Si no se detecta nada
      if (diagnostico.length === 0) {
        diagnostico.push("No se detectaron problemas faciales significativos.");
        recomendaciones.push("Continúa con una rutina de cuidado facial adecuada y usa protector solar diariamente.");
      }
      // Mostrar resultado
      document.getElementById('resultado').innerHTML = `
        <strong>Diagnóstico:</strong> ${diagnostico.join(', ')}<br><br>
        <strong>Recomendaciones:</strong>
        <ul>
          ${recomendaciones.map(r => `<li>${r}</li>`).join('')}
        </ul>
      `;
      showSlide(6);
    }
  </script>
</body>
</html>
